{% extends "learning_logs/base.html" %}

{% block content %}

{% if form.errors %}
<p>Your username and password didn`t math. Please try again.</p>

{% endif %}

<form action="{% url 'user:login' %}" method="post">
    {% csrf_token %}
    {{ form_as_div }}
    <button name="submit">Log in</button>
</form>

{% endblock content %}
